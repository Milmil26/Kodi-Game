<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lengkapi Profil - Coding Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <nav>
    <a class="logo" href="index.html" aria-label="KoDi - Beranda">
      <img class="logo-robot" src="image/logo2.png" alt="">
      <img class="logo-text" src="image/logo1.png" alt="KoDi">
    </a>
  </nav>

  <!--
    Halaman ini jadi "pintu masuk" setelah:
      - login / daftar lewat Google atau Facebook
      - klik tautan konfirmasi email (signup) atau selesai atur ulang kata sandi
    Kalau profil sudah lengkap -> langsung ke beranda sesuai role.
    Kalau belum (akun Google/Facebook baru) -> tampilkan form di bawah.
  -->
  <section class="login">
    <h2 id="judul">Memeriksa akun...</h2>
    <p class="login-sub" id="sub">Sebentar ya.</p>

    <div class="login-card narrow">
      <div class="login-col" id="info">
        <p class="msg" id="status" role="status" aria-live="polite">Memeriksa akun...</p>
        <a class="btn-f full" id="kembali" href="login.html" hidden style="display:block;text-align:center;text-decoration:none">Kembali ke Log in</a>
      </div>

      <form class="login-col" id="form" novalidate hidden>
        <div class="field">
          <label>Daftar sebagai</label>
          <div class="pilih">
            <label><input type="radio" name="role" value="student"><span>Murid</span></label>
            <label><input type="radio" name="role" value="teacher"><span>Guru</span></label>
          </div>
        </div>
        <div class="field">
          <label for="fullname">Nama lengkap</label>
          <input id="fullname" name="fullname" type="text" autocomplete="name">
        </div>
        <div class="field">
          <label for="birth">Tanggal lahir</label>
          <input id="birth" name="birth" type="date" autocomplete="bday">
        </div>
        <div class="field" id="grp-username" hidden>
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" disabled>
          <span class="note">Minimal 4 karakter: huruf, angka, _ atau .</span>
        </div>
        <p class="msg err" id="err" role="alert"></p>
        <button type="submit" class="btn-f full" id="simpan">Simpan dan lanjut</button>
        <button type="button" class="link-btn" id="akun-lain">Pakai akun lain</button>
      </form>
    </div>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
<script src="lengkapi.js"></script>

</body>
</html>
