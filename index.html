<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coding Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <nav>
    <a class="logo" href="index.html" aria-label="KoDi - Beranda">
      <img class="logo-robot" src="image/logo2.png" alt="">
      <img class="logo-text" src="image/logo1.png" alt="KoDi">
    </a>
    <div class="menu">
      <a href="#about" class="on">About</a>
      <a href="#">Learning</a>
      <a href="#">Pages</a>
